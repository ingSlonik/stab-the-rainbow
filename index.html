<head>
  <meta charset="UTF-8">
  <title>Stab the Rainbow</title>
  <script src="https://play.js13kgames.com/2026/webxr/aframe.js"></script>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>

  <div id="m" class="f">
    <div class="c">
      <h1>✨ STAB THE RAINBOW ✨</h1>

      <div class="u mb">
        <strong>🦄 Best in VR Headset!</strong>
        This game was crafted primarily for WebXR VR headsets.
        You can play on a desktop, but you will miss out on the sensation of physically being a unicorn.
        <!-- Original text:
        Be a unicorn in VR Headset or play on desktop.
        <strong>🦄 Best experienced in VR Headset!</strong>
        This game was crafted primarily for WebXR VR headsets, giving you the authentic, embodied feeling of being a
        galloping unicorn! You can play on desktop, but you will miss out on the magical sensation of physically being
        the unicorn.
        -->
      </div>

      <div class="f dc ch mb">
        <button id="bv" class="f b vb dc">
          <strong>🥽 VR MODE</strong>
          <small id="vs">Enter VR • 3D Easy / Hard selection</small>
          <!-- Original: Enter VR • 3D Easy / Hard selection above the rainbow -->
        </button>

        <button id="bd" class="f b pb dc">
          <strong>💻 PLAY ON DESKTOP</strong>
          <small>Mouse: steer • Left: stab • Right: jump</small>
          <!-- Original: Mouse move: steer • Left-click: stab • Right-click / Wheel: jump -->
        </button>
      </div>

      <div id="w mb"></div>
      <small>Made by <a href="https://paulu.cz/" target="_blank" style="color:#00d4ff">Filip</a></small>
    </div>
  </div>

  <!-- A-Frame Scene: #r: rig, #c: camera, #lc: left controller, #rc: right controller -->
  <a-scene rainbow-game vr-mode-ui="enabled:false" keyboard-shortcuts="enterVR:false"
    device-orientation-permission-ui="enabled:false" renderer="antialias:true;powerPreference:high-performance"
    fog="type:exponential;color:#180932;density:0.01">
    <a-sky color="#040011"></a-sky>
    <a-light type="ambient" color="#c4b8ea" intensity="0.8"></a-light>
    <a-light type="directional" color="#fff0d0" intensity="1.15" position="0 25 -100"></a-light>
    <a-entity id="r" position="0 2.25 0">
      <a-camera id="c" position="0 0 0" look-controls="mouseEnabled:false;touchEnabled:false"
        wasd-controls="enabled:false"></a-camera>
      <a-entity id="lc" oculus-touch-controls="hand:left" meta-touch-controls="hand:left"></a-entity>
      <a-entity id="rc" oculus-touch-controls="hand:right" meta-touch-controls="hand:right"></a-entity>
    </a-entity>
  </a-scene>
  <script type="module" src="./src/game.ts"></script>
</body>
