<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stab the Rainbow - js13k WebXR</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <script>
    try {
      if (window.XRWebGLBinding && window.XRWebGLBinding.prototype) {
        delete window.XRWebGLBinding.prototype.createProjectionLayer;
      }
      window.XRWebGLBinding = undefined;
    } catch (_) {}
  </script>
  <script type="module">
    import * as THREE from 'three';
    window.THREE = THREE;
    if (window.bootGame) window.bootGame();
  </script>
  <script type="module" src="./src/game.ts"></script>
</body>

</html>
