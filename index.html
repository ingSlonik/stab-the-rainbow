<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stab the Rainbow</title>
  <script src="https://play.js13kgames.com/2026/webxr/aframe.js"></script>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body>
  <!-- Rozcestník Menu Modal -->
  <div id="modal" class="overlay">
    <div class="card">
      <h1>✨ STAB THE RAINBOW ✨</h1>
      <p class="sub">🦄 Ethereal Unicorn Gallop & Cloud Piercer 🌈</p>

      <div id="high-score" class="badge">🏆 NEJLEPŠÍ SKÓRE: 0</div>

      <div class="choices">
        <button id="btn-vr-easy" class="choice-btn vr-btn">
          <span class="btn-icon">🦄</span>
          <span class="btn-text">
            <strong>VR: JEZDEC NA JEDNOROŽCI (EASY)</strong>
            <small>Roh v ruce • Ovladač: Spoušť = Bodnutí • Grip = Skok</small>
          </span>
        </button>

        <button id="btn-vr-hard" class="choice-btn vr-hard-btn">
          <span class="btn-icon">⚡</span>
          <span class="btn-text">
            <strong>VR: TY JSI JEDNOROŽEC! (HARD)</strong>
            <small>Pohyb těla a hlavy • Trhnutí = Bodnutí • Výskok • Hlášky</small>
          </span>
        </button>

        <button id="btn-desktop" class="choice-btn pc-btn">
          <span class="btn-icon">💻</span>
          <span class="btn-text">
            <strong>HRÁT NA DESKTOPU</strong>
            <small>Myš: Pohyb = řízení • L-klik = Bodnutí • P-klik = Skok</small>
          </span>
        </button>
      </div>

      <div class="controls-guide">
        <p>🎯 <strong>Ovládání:</strong> VR Easy: ovladače • VR Hard: pohyby těla • Desktop: myš / klávesnice
          (šipky/mezerník/S)</p>
      </div>

      <div class="bottom-bar">
        <button id="btn-music" class="mini-btn">🎵 HUDBA: ZAP</button>
        <button id="btn-sfx" class="mini-btn">🔊 ZVUKY: ZAP</button>
        <button id="btn-fs" class="mini-btn">⛶ CELÁ OBRAZOVKA (F)</button>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="go-modal" class="overlay" style="display:none">
    <div class="card go-card">
      <h2>💀 PÁD DO PROPASTI 💀</h2>
      <p id="go-quote" class="sub"></p>
      <div id="go-score" class="badge">SKÓRE: 0</div>
      <div class="choices">
        <button id="btn-retry" class="choice-btn pc-btn">
          <span class="btn-icon">🔄</span>
          <span class="btn-text"><strong>HRÁT ZNOVU</strong></span>
        </button>
        <button id="btn-home" class="choice-btn vr-btn">
          <span class="btn-icon">🏠</span>
          <span class="btn-text"><strong>HLAVNÍ ROZCESTNÍK</strong></span>
        </button>
      </div>
    </div>
  </div>

  <!-- A-Frame Scene -->
  <a-scene id="game-scene" rainbow-game embedded="false" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false" renderer="antialias: true; powerPreference: high-performance"
    fog="type: exponential; color: #180932; density: 0.008">
    <a-sky color="#040011"></a-sky>
    <a-light type="ambient" color="#c4b8ea" intensity="0.8"></a-light>
    <a-light type="directional" color="#fff0d0" intensity="1.15" position="0 25 -100"></a-light>
    <a-entity id="rig" position="0 2.25 0">
      <a-camera id="camera" position="0 0 0" rotation="-14 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
      <a-entity id="left-controller" oculus-touch-controls="hand: left"></a-entity>
      <a-entity id="right-controller" oculus-touch-controls="hand: right"></a-entity>
    </a-entity>
  </a-scene>
  <script type="module" src="./src/game.ts"></script>
</body>

</html>
